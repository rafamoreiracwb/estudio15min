<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravador de Vídeo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 1. BIBLIOTECAS DE CORREÇÃO DE METADADOS (Ficam aqui dentro do <head>) -->
    <script src="https://cdn.jsdelivr.net/npm/fix-webm-duration@1.0.6/fix-webm-duration.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <main class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-5 flex flex-col items-center gap-5">
        <header class="w-full flex items-center justify-between border-b border-slate-700 pb-3">
            <h1 class="text-lg font-semibold tracking-tight text-white">Gravador de Câmera</h1>
            <span id="statusBadge" class="text-xs font-medium px-2.5 py-1 rounded-full bg-slate-700 text-slate-300">
                Aguardando câmera
            </span>
        </header>

        <!-- Tela pequena da webcam -->
        <div class="relative w-full aspect-video max-h-56 bg-black rounded-xl overflow-hidden border border-slate-700 shadow-inner flex items-center justify-center">
            <video id="preview" autoplay muted playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
            
            <!-- Indicador de gravação -->
            <div id="recIndicator" class="hidden absolute top-3 left-3 flex items-center gap-2 bg-black/70 backdrop-blur-sm px-2.5 py-1 rounded-full">
                <span id="recDot" class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
                <span id="recLabel" class="text-xs font-bold tracking-wider uppercase text-white">REC</span>
            </div>

            <!-- Mensagem de erro/permissão -->
            <div id="permissionOverlay" class="hidden absolute inset-0 bg-slate-900/95 p-4 flex flex-col items-center justify-center text-center gap-3">
                <p id="errorText" class="text-sm text-slate-300">Permita o acesso à câmera e ao microfone para continuar.</p>
                <button id="btnRetry" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-lg transition">
                    Solicitar Permissão
                </button>
            </div>
        </div>

        <!-- Barra de progresso (visível apenas no modo 15 min) -->
        <div id="progressContainer" class="hidden w-full">
            <div class="flex justify-between text-xs text-slate-400 mb-1">
                <span>Modo 15 minutos</span>
                <span id="remainingText">Restante: 15:00</span>
            </div>
            <div class="w-full h-2 bg-slate-700 rounded-full overflow-hidden">
                <div id="progressBar" class="h-full bg-indigo-500 transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- Botões de controle -->
        <div class="grid grid-cols-2 gap-3 w-full">
            <button id="btnRecordFree" disabled
                class="col-span-1 py-3 px-4 rounded-xl font-semibold text-sm bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 disabled:cursor-not-allowed text-white shadow transition flex items-center justify-center gap-2">
                <span>●</span> Gravar Livre
            </button>

            <button id="btnRecord15" disabled
                class="col-span-1 py-3 px-4 rounded-xl font-semibold text-sm bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed text-white shadow transition flex items-center justify-center gap-2">
                <span>⏱</span> Gravar 15 min
            </button>

            <button id="btnPause" disabled
                class="col-span-1 py-3 px-4 rounded-xl font-semibold text-sm bg-amber-600 hover:bg-amber-500 disabled:opacity-40 disabled:cursor-not-allowed text-white shadow transition">
                Pausar
            </button>

            <button id="btnStop" disabled
                class="col-span-1 py-3 px-4 rounded-xl font-semibold text-sm bg-rose-600 hover:bg-rose-500 disabled:opacity-40 disabled:cursor-not-allowed text-white shadow transition">
                Parar e Salvar
            </button>
        </div>

        <!-- Cronômetro -->
        <div class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl py-3 px-4 flex flex-col items-center">
            <span class="text-[11px] uppercase tracking-widest text-slate-400 mb-0.5">Tempo de Gravação</span>
            <div id="timerDisplay" class="font-mono text-3xl sm:text-4xl font-bold tracking-wider text-white">
                00:00:00
            </div>
        </div>

        <!-- Link manual de backup caso o download automático seja bloqueado -->
        <div id="downloadContainer" class="hidden w-full text-center">
            <a id="manualDownloadLink" href="#" class="inline-block w-full py-2.5 px-4 rounded-xl bg-slate-700 hover:bg-slate-600 text-sm font-medium text-emerald-400 transition">
                ⬇ Baixar gravação novamente
            </a>
        </div>
    </main>

    <!-- 2. TODO O JAVASCRIPT FICA AQUI NO FINAL, ANTES DE FECHAR O </body> -->
    <script>
        const LIMITE_15_MIN_MS = 15 * 60 * 1000; // 900.000 ms

        const preview = document.getElementById('preview');
        const statusBadge = document.getElementById('statusBadge');
        const recIndicator = document.getElementById('recIndicator');
        const recDot = document.getElementById('recDot');
        const recLabel = document.getElementById('recLabel');
        const permissionOverlay = document.getElementById('permissionOverlay');
        const errorText = document.getElementById('errorText');
        const btnRetry = document.getElementById('btnRetry');

        const btnRecordFree = document.getElementById('btnRecordFree');
        const btnRecord15 = document.getElementById('btnRecord15');
        const btnPause = document.getElementById('btnPause');
        const btnStop = document.getElementById('btnStop');

        const timerDisplay = document.getElementById('timerDisplay');
        const progressContainer = document.getElementById('progressContainer');
        const remainingText = document.getElementById('remainingText');
        const progressBar = document.getElementById('progressBar');
        const downloadContainer = document.getElementById('downloadContainer');
        const manualDownloadLink = document.getElementById('manualDownloadLink');

        let mediaStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];

        let timerInterval = null;
        let startTime = 0;
        let elapsedBeforePause = 0;
        let isTimedMode = false;

        // =====================================================================
        // FUNÇÕES DE CORREÇÃO DE METADADOS (WEBM E MP4)
        // =====================================================================
        async function corrigirMetadadosVideo(blobOriginal, duracaoMs) {
            const tipo = (blobOriginal.type || '').toLowerCase();

            // CENÁRIO 1: WebM (Chrome, Edge, Firefox, Android)
            if (tipo.includes('webm')) {
                return new Promise((resolve) => {
                    if (typeof ysFixWebmDuration === 'function') {
                        ysFixWebmDuration(blobOriginal, duracaoMs, (blobCorrigido) => {
                            resolve({ blob: blobCorrigido, extensao: 'webm' });
                        });
                    } else {
                        resolve({ blob: blobOriginal, extensao: 'webm' });
                    }
                });
            }

            // CENÁRIO 2: MP4 nativo (Safari/iOS ou Chrome com mp4)
            if (tipo.includes('mp4')) {
                try {
                    const blobMp4Corrigido = await remuxarMp4(blobOriginal);
                    return { blob: blobMp4Corrigido, extensao: 'mp4' };
                } catch (erro) {
                    console.warn('Falha ao remuxar MP4, usando original:', erro);
                    return { blob: blobOriginal, extensao: 'mp4' };
                }
            }

            return { blob: blobOriginal, extensao: 'webm' };
        }

        function remuxarMp4(blobMp4) {
            return new Promise(async (resolve, reject) => {
                if (typeof MP4Box === 'undefined') {
                    return reject(new Error('MP4Box não carregado.'));
                }

                const arrayBuffer = await blobMp4.arrayBuffer();
                arrayBuffer.fileStart = 0;

                const mp4boxInput = MP4Box.createFile();
                const mp4boxOutput = MP4Box.createFile();
                const faixasConfiguradas = new Map();

                mp4boxInput.onError = (e) => reject(e);

                mp4boxInput.onReady = (info) => {
                    info.tracks.forEach((track) => {
                        const trackOptions = {
                            timescale: track.timescale,
                            width: track.track_width,
                            height: track.track_height,
                            brands: info.brands,
                            avcDecoderConfigRecord: null
                        };

                        const trak = mp4boxInput.getTrackById(track.id);
                        for (const entry of trak.mdia.minf.stbl.stsd.entries) {
                            if (entry.avcC) {
                                const stream = new DataStream(undefined, 0, DataStream.BIG_ENDIAN);
                                entry.avcC.write(stream);
                                trackOptions.avcDecoderConfigRecord = new Uint8Array(stream.buffer, 8);
                            } else if (entry.esds) {
                                trackOptions.esds = entry.esds;
                            }
                        }

                        const novoTrackId = mp4boxOutput.addTrack(trackOptions);
                        faixasConfiguradas.set(track.id, novoTrackId);
                        mp4boxInput.setExtractionOptions(track.id, null, { nbSamples: 1000 });
                    });

                    mp4boxInput.start();
                };

                mp4boxInput.onSamples = (id, user, samples) => {
                    const novoTrackId = faixasConfiguradas.get(id);
                    if (!novoTrackId) return;

                    for (const sample of samples) {
                        mp4boxOutput.addSample(novoTrackId, sample.data, {
                            duration: sample.duration,
                            dts: sample.dts,
                            cts: sample.cts,
                            is_sync: sample.is_sync
                        });
                    }
                };

                mp4boxInput.appendBuffer(arrayBuffer);
                mp4boxInput.flush();

                const bufferFinal = mp4boxOutput.getBuffer();
                if (bufferFinal && bufferFinal.byteLength > 0) {
                    resolve(new Blob([bufferFinal], { type: 'video/mp4' }));
                } else {
                    reject(new Error('Buffer de saída vazio.'));
                }
            });
        }

        // =====================================================================
        // LÓGICA DA CÂMERA, CRONÔMETRO E GRAVAÇÃO
        // =====================================================================
        async function iniciarCamera() {
            permissionOverlay.classList.add('hidden');
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user' },
                    audio: true
                });
                preview.srcObject = mediaStream;
                statusBadge.textContent = 'Câmera pronta';
                statusBadge.className = 'text-xs font-medium px-2.5 py-1 rounded-full bg-emerald-900/60 text-emerald-300 border border-emerald-700/50';
                btnRecordFree.disabled = false;
                btnRecord15.disabled = false;
            } catch (err) {
                console.error(err);
                statusBadge.textContent = 'Sem acesso';
                statusBadge.className = 'text-xs font-medium px-2.5 py-1 rounded-full bg-rose-900/60 text-rose-300';
                errorText.textContent = 'Não foi possível acessar câmera/microfone. Verifique as permissões do navegador.';
                permissionOverlay.classList.remove('hidden');
            }
        }

        function formatarTempo(ms) {
            const totalSegundos = Math.floor(ms / 1000);
            const horas = String(Math.floor(totalSegundos / 3600)).padStart(2, '0');
            const minutos = String(Math.floor((totalSegundos % 3600) / 60)).padStart(2, '0');
            const segundos = String(totalSegundos % 60).padStart(2, '0');
            return `${horas}:${minutos}:${segundos}`;
        }

        function formatarMinSeg(ms) {
            const totalSegundos = Math.max(0, Math.ceil(ms / 1000));
            const minutos = String(Math.floor(totalSegundos / 60)).padStart(2, '0');
            const segundos = String(totalSegundos % 60).padStart(2, '0');
            return `${minutos}:${segundos}`;
        }

        function atualizarCronometro() {
            const agora = Date.now();
            const tempoAtualMs = elapsedBeforePause + (agora - startTime);
            timerDisplay.textContent = formatarTempo(tempoAtualMs);

            if (isTimedMode) {
                const restante = LIMITE_15_MIN_MS - tempoAtualMs;
                const percentual = Math.min(100, (tempoAtualMs / LIMITE_15_MIN_MS) * 100);
                progressBar.style.width = `${percentual}%`;
                remainingText.textContent = `Restante: ${formatarMinSeg(restante)}`;

                if (tempoAtualMs >= LIMITE_15_MIN_MS) {
                    pararGravacao();
                }
            }
        }

        function obterMimeTypeSuportado() {
            const tipos = [
                'video/webm;codecs=vp9,opus',
                'video/webm;codecs=vp8,opus',
                'video/webm',
                'video/mp4'
            ];
            for (const tipo of tipos) {
                if (MediaRecorder.isTypeSupported(tipo)) {
                    return tipo;
                }
            }
            return '';
        }

        function iniciarGravacao(modo15Min) {
            if (!mediaStream) return;

            isTimedMode = modo15Min;
            recordedChunks = [];
            elapsedBeforePause = 0;
            downloadContainer.classList.add('hidden');

            const mimeType = obterMimeTypeSuportado();
            mediaRecorder = mimeType
                ? new MediaRecorder(mediaStream, { mimeType })
                : new MediaRecorder(mediaStream);

            mediaRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            // AQUI ACONTECE A CORREÇÃO AUTOMÁTICA ANTES DE SALVAR
            mediaRecorder.onstop = async () => {
                statusBadge.textContent = 'Processando vídeo...';
                const duracaoFinalMs = elapsedBeforePause;
                const blobBruto = new Blob(recordedChunks, { type: mediaRecorder.mimeType });

                const { blob: blobCorrigido, extensao } = await corrigirMetadadosVideo(blobBruto, duracaoFinalMs);

                const url = URL.createObjectURL(blobCorrigido);
                const dataHora = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
                const nomeArquivo = `gravacao-${dataHora}.${extensao}`;

                // Download automático
                const link = document.createElement('a');
                link.href = url;
                link.download = nomeArquivo;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // Atualiza link de backup
                manualDownloadLink.href = url;
                manualDownloadLink.download = nomeArquivo;
                downloadContainer.classList.remove('hidden');

                statusBadge.textContent = 'Salvo com sucesso';
                statusBadge.className = 'text-xs font-medium px-2.5 py-1 rounded-full bg-emerald-900/60 text-emerald-300 border border-emerald-700/50';
            };

            mediaRecorder.start(1000);
            startTime = Date.now();
            timerDisplay.textContent = '00:00:00';
            timerInterval = setInterval(atualizarCronometro, 200);

            if (isTimedMode) {
                progressContainer.classList.remove('hidden');
                progressBar.style.width = '0%';
                remainingText.textContent = 'Restante: 15:00';
            } else {
                progressContainer.classList.add('hidden');
            }

            // Atualiza interface
            recIndicator.classList.remove('hidden');
            recDot.classList.add('animate-pulse');
            recLabel.textContent = 'REC';
            statusBadge.textContent = isTimedMode ? 'Gravando (15 min)' : 'Gravando livre';
            statusBadge.className = 'text-xs font-medium px-2.5 py-1 rounded-full bg-rose-900/70 text-rose-200 border border-rose-700/50';

            btnRecordFree.disabled = true;
            btnRecord15.disabled = true;
            btnPause.disabled = false;
            btnPause.textContent = 'Pausar';
            btnStop.disabled = false;
        }

        function alternarPausa() {
            if (!mediaRecorder) return;

            if (mediaRecorder.state === 'recording') {
                mediaRecorder.pause();
                clearInterval(timerInterval);
                elapsedBeforePause += Date.now() - startTime;

                btnPause.textContent = 'Retomar';
                recDot.classList.remove('animate-pulse');
                recLabel.textContent = 'PAUSADO';
                statusBadge.textContent = 'Pausado';
                statusBadge.className = 'text-xs font-medium px-2.5 py-1 rounded-full bg-amber-900/70 text-amber-200';
            } else if (mediaRecorder.state === 'paused') {
                mediaRecorder.resume();
                startTime = Date.now();
                timerInterval = setInterval(atualizarCronometro, 200);

                btnPause.textContent = 'Pausar';
                recDot.classList.add('animate-pulse');
                recLabel.textContent = 'REC';
                statusBadge.textContent = isTimedMode ? 'Gravando (15 min)' : 'Gravando livre';
                statusBadge.className = 'text-xs font-medium px-2.5 py-1 rounded-full bg-rose-900/70 text-rose-200';
            }
        }

        function pararGravacao() {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') return;

            if (mediaRecorder.state === 'recording') {
                elapsedBeforePause += Date.now() - startTime;
            }
            clearInterval(timerInterval);
            timerDisplay.textContent = formatarTempo(elapsedBeforePause);

            mediaRecorder.stop();

            // Restaura botões
            recIndicator.classList.add('hidden');
            progressContainer.classList.add('hidden');
            btnRecordFree.disabled = false;
            btnRecord15.disabled = false;
            btnPause.disabled = true;
            btnPause.textContent = 'Pausar';
            btnStop.disabled = true;
        }

        btnRetry.addEventListener('click', iniciarCamera);
        btnRecordFree.addEventListener('click', () => iniciarGravacao(false));
        btnRecord15.addEventListener('click', () => iniciarGravacao(true));
        btnPause.addEventListener('click', alternarPausa);
        btnStop.addEventListener('click', pararGravacao);

        window.addEventListener('DOMContentLoaded', iniciarCamera);
    </script>
</body>
</html>
